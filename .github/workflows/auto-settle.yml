name: Auto-settle picks

# Grades pending picks (handicapper + contest) from the odds feed's final scores
# and ESPN's period linescores.
#
# Why this exists: Vercel's Hobby plan allows only one cron run per day, so
# vercel.json runs the sweep once at 04:00 UTC. This workflow adds the other two
# runs for free. If you later upgrade to Vercel Pro you can delete this file and
# set vercel.json's schedule to "0 4,12,20 * * *" instead.
#
# Setup (one time):
#   1. Repo → Settings → Secrets and variables → Actions → New repository secret
#        CRON_SECRET  = the same value as the CRON_SECRET env var in Vercel
#        SITE_URL     = https://blitz.tips        (optional; defaults to that)
#   2. That's it — the runs show up under the Actions tab.
#
# The sweep is idempotent: it only touches picks that are still PENDING and
# whose game has finished, so extra or repeated runs are harmless.

on:
  schedule:
    # 12:00 and 20:00 UTC — vercel.json already covers 04:00.
    - cron: "0 12 * * *"
    - cron: "0 20 * * *"
  # Lets you trigger a grading run by hand from the Actions tab.
  workflow_dispatch:

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger auto-settle
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://blitz.tips' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is not set — see the header of this file."
            exit 1
          fi

          # Capture the body and status separately so a failure is readable.
          http_status=$(curl -sS -o response.json -w '%{http_code}' \
            --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/auto-settle")

          echo "HTTP $http_status"
          cat response.json
          echo

          if [ "$http_status" != "200" ]; then
            echo "::error::Auto-settle returned HTTP $http_status"
            exit 1
          fi

          # Surface the counts in the run summary so you can see grading working
          # without opening the site.
          {
            echo "### Auto-settle"
            echo '```json'
            cat response.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
