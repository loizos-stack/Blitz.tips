name: Blitz Odds watcher

# Polls the odds feed for prices shortening at several sportsbooks before
# kickoff, and delivers the alerts.
#
# Why this exists: Vercel's Hobby plan allows only one cron run per day, and a
# drop detector that runs daily detects nothing. This workflow supplies the
# cadence instead — the same arrangement auto-settle.yml already uses.
#
# CAVEAT worth knowing: GitHub's scheduler is best-effort. A workflow set to
# every 5 minutes routinely fires 10-15 minutes late when the shared runners are
# busy, and can skip a slot entirely. That matters more here than for most jobs,
# because the alert band is only ~6 minutes wide — a run that arrives late can
# miss it completely and the game reports nothing.
#
# Each run therefore polls 5 times at 60-second intervals rather than once, so a
# single scheduled run covers the whole five minutes until the next one. Drift
# then shifts the coverage rather than punching holes in it. This is a
# workaround, not a fix: Vercel Pro allows minute-level crons, and with it this
# file can be deleted and the schedule moved into vercel.json.
#
# COST: every run spends odds-feed credits. The watcher enforces its own daily
# cap (Admin -> Blitz Odds -> Daily credit cap) and stops when it is reached, so
# a stuck or over-frequent schedule cannot drain the quota — but the cap is the
# safety net, not the plan. Check the panel's usage meter after the first day.
#
# Setup (one time):
#   1. Repo -> Settings -> Secrets and variables -> Actions -> New repository secret
#        CRON_SECRET  = the same value as the CRON_SECRET env var in Vercel
#        SITE_URL     = https://blitz.tips        (optional; defaults to that)
#   2. Switch the watcher on in Admin -> Blitz Odds. Until then this returns
#      immediately, spends nothing, and simply reports that it is off.

on:
  schedule:
    # Every 5 minutes — the shortest interval GitHub allows. Each run then polls
    # several times internally (see POLL_SECONDS below), because 5 minutes on its
    # own is not fast enough: the alert band is 6 minutes wide, and a scheduler
    # that drifts — which GitHub's does, routinely by 10-15 minutes under load —
    # would skip straight past it and report nothing for most games.
    - cron: "*/5 * * * *"

  # Runs a cycle by hand from the Actions tab. Useful for smoke-testing a
  # preview deploy, or checking which books the feed actually answers with.
  workflow_dispatch:
    inputs:
      site_url:
        description: "Override the target site (e.g. a preview URL). Defaults to the SITE_URL secret."
        required: false
        default: ""

# A slow cycle must never overlap the next one: two runs polling at once would
# double-spend credits and race on the same snapshot rows.
concurrency:
  group: blitz-odds
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Run a Blitz Odds cycle
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ inputs.site_url || secrets.SITE_URL || 'https://blitz.tips' }}
          # Seconds between passes, and how many. 5 passes x 60s covers the whole
          # gap to the next scheduled run, so coverage is continuous rather than
          # one sample every five minutes.
          POLL_SECONDS: "60"
          POLL_PASSES: "5"
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is not set — see the header of this file."
            exit 1
          fi

          fail=0
          # Totals across the whole run. Reporting only the last pass would
          # understate spend by a factor of POLL_PASSES, and spend is the number
          # this summary exists to show.
          tot_credits=0; tot_requests=0; tot_drops=0; last_events=0
          for pass in $(seq 1 "$POLL_PASSES"); do
            [ "$pass" -gt 1 ] && sleep "$POLL_SECONDS"
            echo "--- pass $pass/$POLL_PASSES"

            http_status=$(curl -sS -o response.json -w '%{http_code}' \
              --max-time 120 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$SITE_URL/api/cron/blitz-odds") || http_status=000

            echo "HTTP $http_status"

            # One bad pass does not end the run — a blip must not cost the
            # remaining passes, which are the ones that might catch the game.
            if [ "$http_status" != "200" ]; then
              echo "::warning::pass $pass returned HTTP $http_status"
              head -c 500 response.json
              fail=$((fail + 1))
              continue
            fi
            cat response.json
            echo

            if jq -e 'type == "object" and has("credits")' response.json >/dev/null 2>&1; then
              tot_credits=$((tot_credits + $(jq -r '.credits // 0' response.json)))
              tot_requests=$((tot_requests + $(jq -r '.requests // 0' response.json)))
              tot_drops=$((tot_drops + $(jq -r '.dropsFound // 0' response.json)))
              last_events=$(jq -r '.eventsSeen // 0' response.json)
            fi
          done

          if [ "$fail" -ge "$POLL_PASSES" ]; then
            echo "::error::every pass failed — see the warnings above"
            exit 1
          fi

          # A 200 is not proof of success. The site answers an unknown path with
          # its own not-found PAGE — HTML, status 200 — so checking the status
          # alone let a missing route through, and the failure then surfaced as
          # an unreadable jq parse error further down. Confirm the body is
          # actually the JSON this endpoint returns before trusting any of it.
          if ! jq -e 'type == "object" and has("credits")' response.json >/dev/null 2>&1; then
            echo "::error::Expected JSON from /api/cron/blitz-odds but got something else. \
          The usual cause is that $SITE_URL does not have this route deployed yet — check that the \
          Blitz Odds branch is live on that domain."
            head -c 2000 response.json
            exit 1
          fi

          # Surface spend and findings in the run summary, so the cost of the
          # tool is visible from the Actions tab without opening the site.
          {
            echo "### Blitz Odds"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Passes | $POLL_PASSES (every ${POLL_SECONDS}s) |"
            echo "| Events in window (last pass) | $last_events |"
            echo "| Drops found | $tot_drops |"
            echo "| Credits spent | $tot_credits |"
            echo "| Requests | $tot_requests |"
            stopped=$(jq -r '.stoppedReason // empty' response.json)
            if [ -n "$stopped" ]; then
              echo ""
              echo "**Stopped early:** $stopped"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
