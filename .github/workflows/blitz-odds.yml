name: Blitz Odds watcher

# Polls the odds feed for prices shortening at several sportsbooks before
# kickoff, and delivers the alerts.
#
# Why this exists: Vercel's Hobby plan allows only one cron run per day, and a
# drop detector that runs daily detects nothing. This workflow supplies the
# cadence instead — the same arrangement auto-settle.yml already uses.
#
# CAVEAT worth knowing: GitHub's scheduler is best-effort. A workflow set to
# every 5 minutes routinely fires 10-15 minutes late when the shared runners are
# busy, and can skip a slot entirely. For a tool whose value is catching a move
# before a game starts, that is a real limitation — if Blitz Odds proves useful,
# Vercel Pro (which allows minute-level crons) is the fix, at which point this
# file can be deleted and the schedule moved into vercel.json.
#
# COST: every run spends odds-feed credits. The watcher enforces its own daily
# cap (Admin -> Blitz Odds -> Daily credit cap) and stops when it is reached, so
# a stuck or over-frequent schedule cannot drain the quota — but the cap is the
# safety net, not the plan. Check the panel's usage meter after the first day.
#
# Setup (one time):
#   1. Repo -> Settings -> Secrets and variables -> Actions -> New repository secret
#        CRON_SECRET  = the same value as the CRON_SECRET env var in Vercel
#        SITE_URL     = https://blitz.tips        (optional; defaults to that)
#   2. Switch the watcher on in Admin -> Blitz Odds. Until then this returns
#      immediately, spends nothing, and simply reports that it is off.

on:
  # The schedule is deliberately commented out until this is merged and the
  # route exists on the production domain. Left enabled it hit
  # https://blitz.tips/api/cron/blitz-odds every 10 minutes, got the site's
  # not-found page, and failed the job — a recurring red cross on a feature that
  # simply is not deployed yet, which is the fastest way to teach everyone to
  # ignore CI.
  #
  # AFTER MERGING: uncomment the two lines below. Keep the interval matching the
  # watcher's pollMinutes — the panel setting describes the cadence, this file
  # supplies it.
  #
  # FIVE MINUTES IS THE MINIMUM THAT WORKS, and it is tight. A drop is only
  # found when BOTH windows were sampled: one price between 16 and 30 minutes
  # before kickoff, another inside the final 15. A fourteen-minute baseline
  # window needs at least two chances to land in it, and GitHub's scheduler is
  # best-effort — it routinely fires late and occasionally skips a slot, so a
  # game can silently produce nothing through no fault of the watcher. If this
  # tool matters, Vercel Pro's minute-level cron is the fix; this is the
  # workaround.
  #
  # schedule:
  #   - cron: "*/5 * * * *"

  # Runs a cycle by hand from the Actions tab. Works today against whatever
  # SITE_URL points at, and is the right way to smoke-test a preview deploy.
  workflow_dispatch:
    inputs:
      site_url:
        description: "Override the target site (e.g. a preview URL). Defaults to the SITE_URL secret."
        required: false
        default: ""

# A slow cycle must never overlap the next one: two runs polling at once would
# double-spend credits and race on the same snapshot rows.
concurrency:
  group: blitz-odds
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Run a Blitz Odds cycle
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ inputs.site_url || secrets.SITE_URL || 'https://blitz.tips' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is not set — see the header of this file."
            exit 1
          fi

          http_status=$(curl -sS -o response.json -w '%{http_code}' \
            --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/blitz-odds")

          echo "HTTP $http_status"

          if [ "$http_status" != "200" ]; then
            echo "::error::Blitz Odds returned HTTP $http_status"
            head -c 2000 response.json
            exit 1
          fi

          # A 200 is not proof of success. The site answers an unknown path with
          # its own not-found PAGE — HTML, status 200 — so checking the status
          # alone let a missing route through, and the failure then surfaced as
          # an unreadable jq parse error four commands later. Confirm the body is
          # actually the JSON this endpoint returns before trusting any of it.
          if ! jq -e 'type == "object" and has("credits")' response.json >/dev/null 2>&1; then
            echo "::error::Expected JSON from /api/cron/blitz-odds but got something else. \
          The usual cause is that $SITE_URL does not have this route deployed yet — check that the \
          Blitz Odds branch is live on that domain."
            head -c 2000 response.json
            exit 1
          fi

          cat response.json
          echo

          # Surface spend and findings in the run summary, so the cost of the
          # tool is visible from the Actions tab without opening the site.
          {
            echo "### Blitz Odds"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Events watched | $(jq -r '.eventsSeen // 0' response.json) |"
            echo "| Drops found | $(jq -r '.dropsFound // 0' response.json) |"
            echo "| Credits spent | $(jq -r '.credits // 0' response.json) |"
            echo "| Requests | $(jq -r '.requests // 0' response.json) |"
            stopped=$(jq -r '.stoppedReason // empty' response.json)
            if [ -n "$stopped" ]; then
              echo ""
              echo "**Stopped early:** $stopped"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
