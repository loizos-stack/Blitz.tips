name: Results recap video

# Renders the previous day's settled picks into a 9:16 MP4 and posts it back to
# the site, where it appears in Admin → Recaps ready to download and upload to
# TikTok / Reels / Shorts.
#
# Why it lives here rather than in vercel.json: rendering needs a browser and
# ffmpeg, and the Vercel runtime has neither. A GitHub runner has both. (The
# Hobby plan's single daily cron slot is also already taken by auto-settle.)
#
# Setup (one time) — the same secrets the other workflows use:
#   Repo → Settings → Secrets and variables → Actions → New repository secret
#     CRON_SECRET = the same value as the CRON_SECRET env var in Vercel
#     SITE_URL    = https://blitz.tips        (optional; defaults to that)
#
# Safe to re-run: one video per day, overwritten in place.

on:
  schedule:
    # 09:20 UTC — late enough that the previous day's US night games have been
    # graded by the auto-settle run, early enough to post in the morning.
    - cron: "20 9 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Day to render, YYYY-MM-DD in UTC (default: yesterday)"
        type: string
        required: false

jobs:
  recap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Not a project dependency: it is only ever used here, and adding it to
      # package.json would make every Vercel build install it for nothing.
      - name: Install renderer
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Fetch the day's results
        id: fetch
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://blitz.tips' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is not set — see the header of this file."
            exit 1
          fi

          URL="$SITE_URL/api/cron/recap"
          if [ -n "${{ inputs.date }}" ]; then URL="$URL?date=${{ inputs.date }}"; fi

          http_status=$(curl -sS -o payload.json -w '%{http_code}' \
            --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$URL")

          if [ "$http_status" != "200" ]; then
            echo "::error::Recap data returned HTTP $http_status"
            cat payload.json
            exit 1
          fi

          echo "date=$(jq -r .date payload.json)" >> "$GITHUB_OUTPUT"
          echo "settled=$(jq -r .totals.settled payload.json)" >> "$GITHUB_OUTPUT"
          jq -r '"\(.label): \(.totals.record), \(.totals.units)u from \(.totals.settled) settled"' payload.json

      - name: Render
        id: render
        run: |
          set +e
          node tools/video/render-recap.mjs payload.json recap.mp4
          code=$?
          set -e
          # 3 is the renderer's own "nothing settled that day" exit. That is a
          # quiet day, not a failure, so the job ends green with no video.
          if [ $code -eq 3 ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "Nothing settled on ${{ steps.fetch.outputs.date }} — no video." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit $code

      - name: Upload to the site
        if: steps.render.outputs.skipped != 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://blitz.tips' }}
        run: |
          http_status=$(curl -sS -o upload.json -w '%{http_code}' \
            --max-time 120 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: video/mp4" \
            --data-binary @recap.mp4 \
            "$SITE_URL/api/cron/recap?date=${{ steps.fetch.outputs.date }}")

          echo "HTTP $http_status"
          cat upload.json
          echo

          if [ "$http_status" != "200" ]; then
            echo "::error::Upload returned HTTP $http_status"
            exit 1
          fi

          {
            echo "### Recap for ${{ steps.fetch.outputs.date }}"
            jq -r '"[Download](\(.url)) — \(.bytes) bytes"' upload.json
          } >> "$GITHUB_STEP_SUMMARY"

      # Kept on the run as well, so a failed upload does not mean a lost render.
      - name: Keep a copy on the run
        if: steps.render.outputs.skipped != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: recap-${{ steps.fetch.outputs.date }}
          path: recap.mp4
          retention-days: 14
