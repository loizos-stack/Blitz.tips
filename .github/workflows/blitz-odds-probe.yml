name: Blitz Odds — check the feed

# Asks a deployment what the odds feed actually answers with, and prints it.
#
# Why this exists: the Rundown adapter has to guess three things it cannot check
# from a checkout — which host the key belongs to, the numeric sport ids, and the
# field names inside a line. All three fail the same way, with requests that
# succeed, cost money, and carry nothing storable. One live read settles all
# three, and running it from here means it can be aimed at ANY deployment,
# including a preview build that no browser session can sign in to.
#
# Run by hand only. It reads; it writes nothing and changes no setting.
#
# The target defaults to the SITE_URL secret. Point it at the preview URL from
# the pull request when production is behind the branch — otherwise the answer
# describes whatever code production happens to be running, which is the exact
# confusion this is meant to end.

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Deployment to ask (e.g. the PR's preview URL). Defaults to the SITE_URL secret."
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the feed
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ inputs.site_url || secrets.SITE_URL || 'https://blitz.tips' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is not set."
            exit 1
          fi

          echo "Asking $SITE_URL"
          status=$(curl -sS -o probe.json -w '%{http_code}' -X POST \
            --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/admin/blitz-odds/probe") || status=000
          echo "HTTP $status"

          # A 200 is not proof: an unknown path answers with the site's own
          # not-found PAGE, as HTML, at status 200. Check the body is the JSON
          # this endpoint returns before reading anything off it.
          if ! jq -e 'type == "object" and has("tried")' probe.json >/dev/null 2>&1; then
            echo "::error::That deployment did not answer with the probe's JSON — \
          the usual cause is that it is running a build from before this route existed. \
          Check which commit $SITE_URL is serving."
            head -c 1000 probe.json
            exit 1
          fi

          jq . probe.json

          {
            echo "### What the feed answered"
            echo ""
            echo '```json'
            jq . probe.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
