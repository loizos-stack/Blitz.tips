<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Monthly prize card</title>
    <style>
      /*
        The 1600x900 landscape card for X, the still counterpart to
        prize-scene.html next door.

        It exists as a file rather than as a one-off script because the prize
        figures change: when they do, this and the video re-render from the
        same edit instead of someone remembering which image had the old
        numbers burned into it.
      */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1600px; height: 900px; overflow: hidden;
        background: #0b0f14; color: #fff;
        font-family: Inter, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .glow { position: absolute; border-radius: 50%; filter: blur(150px); }
      .g1 { width: 820px; height: 820px; background: #16a34a; top: -260px; right: -220px; opacity: .30; }
      .g2 { width: 620px; height: 620px; background: #eab308; bottom: -260px; left: -200px; opacity: .18; }

      .wrap { position: relative; height: 100%; padding: 96px; display: flex; flex-direction: column; }

      .brand { display: flex; align-items: center; gap: 16px; }
      .brand svg { width: 58px; height: 58px; }
      .brand span { font-size: 38px; font-weight: 700; letter-spacing: -1px; }
      .brand i { color: #22c55e; font-style: normal; }

      .kicker {
        margin-top: 50px; font-size: 26px; font-weight: 600; letter-spacing: 4px;
        text-transform: uppercase; color: #eab308;
      }
      h1 { margin-top: 10px; font-size: 128px; font-weight: 800; line-height: 1; letter-spacing: -5px; }
      h1 em { font-style: normal; color: #eab308; }
      .sub { margin-top: 26px; font-size: 32px; line-height: 1.4; color: rgba(255,255,255,.72); max-width: 1120px; }
      .sub b { color: #fff; font-weight: 600; }

      .tiers { margin-top: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
      .tier {
        display: flex; align-items: center; justify-content: space-between;
        background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1);
        border-radius: 22px; padding: 26px 34px;
      }
      .tier .p { font-size: 26px; font-weight: 600; color: rgba(255,255,255,.55); }
      .tier .m { font-size: 62px; font-weight: 800; letter-spacing: -2px; }
      .t1 .m { color: #eab308; } .t2 .m { color: #d4d4d8; } .t3 .m { color: #d08b4a; }

      .foot { margin-top: 40px; display: flex; justify-content: space-between; align-items: baseline; }
      .foot .url { font-size: 26px; color: rgba(255,255,255,.5); }
      .foot .tag { font-size: 26px; font-weight: 600; color: #22c55e; }
    </style>
  </head>
  <body>
    <div class="glow g1"></div>
    <div class="glow g2"></div>
    <div class="wrap">
      <div class="brand">
        <svg viewBox="0 0 40 40" fill="none">
          <defs>
            <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fde047" />
              <stop offset="100%" stop-color="#eab308" />
            </linearGradient>
          </defs>
          <rect width="40" height="40" rx="10" fill="#16a34a" />
          <path d="M22 6 L11 23 H18.5 L16 35 L29 19 H21.5 L24 6 Z" fill="#fde047" fill-opacity="0.14"
                stroke="url(#gold)" stroke-width="2.6" stroke-linejoin="round" />
        </svg>
        <span>Blitz<i>.tips</i></span>
      </div>

      <div class="kicker">Starts Sunday 1 November</div>
      <h1><em>$500</em> every month</h1>
      <div class="sub">
        To the handicappers with the best <b>settled record</b> of the month. Ranked on the public,
        unedited track record — the same one you can check yourself.
      </div>

      <div class="tiers">
        <div class="tier t1"><span class="p">1st</span><span class="m">$250</span></div>
        <div class="tier t2"><span class="p">2nd</span><span class="m">$150</span></div>
        <div class="tier t3"><span class="p">3rd</span><span class="m">$100</span></div>
      </div>

      <div class="foot">
        <div class="url">blitz.tips/leaderboard</div>
        <div class="tag">Every pick timestamped before the game.</div>
      </div>
    </div>
  </body>
</html>
